name: Terraform

on:
  pull_request:
    branches: [main, homolog, production]
  push:
    branches: [homolog, production]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a reaplicar após renovar as credenciais do Learner Lab
        required: true
        type: choice
        options: [homolog, production]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  check:
    name: Formato e validação sem credenciais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init sem backend
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  plan:
    name: Plan (${{ matrix.environment }})
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [homolog]
    environment: ${{ matrix.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Validar configuração obrigatória
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET não configurado no Environment ${{ matrix.environment }}" >&2; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Credenciais AWS ausentes no Environment ${{ matrix.environment }}" >&2; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Credenciais AWS ausentes no Environment ${{ matrix.environment }}" >&2; exit 1; }
          test -n "$AWS_SESSION_TOKEN" || { echo "AWS_SESSION_TOKEN ausente no Environment ${{ matrix.environment }}" >&2; exit 1; }
          test -n "$TF_VAR_db_password" || { echo "DB_PASSWORD ausente no Environment ${{ matrix.environment }}" >&2; exit 1; }

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=oficina-infra-db/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        run: |
          terraform plan -input=false -lock-timeout=60s \
            -var-file="envs/${{ matrix.environment }}.tfvars" \
            -no-color

  apply:
    name: Apply (${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }})
    if: >-
      (github.event_name == 'push' && contains(fromJSON('["homolog","production"]'), github.ref_name)) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == github.ref_name)
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
    concurrency:
      group: terraform-apply-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Validar configuração obrigatória
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET não configurado no Environment selecionado" >&2; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Credenciais AWS ausentes no Environment selecionado" >&2; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Credenciais AWS ausentes no Environment selecionado" >&2; exit 1; }
          test -n "$AWS_SESSION_TOKEN" || { echo "AWS_SESSION_TOKEN ausente no Environment selecionado" >&2; exit 1; }
          test -n "$TF_VAR_db_password" || { echo "DB_PASSWORD ausente no Environment selecionado" >&2; exit 1; }

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=oficina-infra-db/${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: terraform apply
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=60s \
            -var-file="envs/${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}.tfvars"

      - name: Outputs
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
